<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>דוח גביה | קבוצת AM הנדסה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<style>
:root {
  --bg:       #0d0f12;
  --bg2:      #12151a;
  --surface:  #181c23;
  --surface2: #1e2330;
  --surface3: #242a38;
  --border:   rgba(255,255,255,.06);
  --border2:  rgba(255,255,255,.12);
  --text:     #e8eaf0;
  --text2:    #8890a4;
  --text3:    #525a6e;
  --gold:     #c9a84c;
  --gold2:    #e8c96e;
  --gold-dim: rgba(201,168,76,.12);
  --green:    #34d399;
  --green-dim:rgba(52,211,153,.12);
  --amber:    #fbbf24;
  --amber-dim:rgba(251,191,36,.12);
  --orange:   #f97316;
  --orange-dim:rgba(249,115,22,.12);
  --red:      #f87171;
  --red-dim:  rgba(248,113,113,.12);
  --radius:   8px;
  --radius-lg:12px;
  --radius-xl:16px;
  --glow: 0 0 40px rgba(201,168,76,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ─── Noise texture overlay ─── */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.4}

/* ─── Header ─── */
header{
  background:linear-gradient(135deg,#0f1318 0%,#161b25 100%);
  border-bottom:1px solid var(--border2);
  padding:0 40px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  box-shadow:0 4px 32px rgba(0,0,0,.4);
}
.header-left{display:flex;align-items:center;gap:16px}
.header-logo-mark{
  width:36px;height:36px;border-radius:8px;
  background:linear-gradient(135deg,var(--gold),#a07830);
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:#0d0f12;
  box-shadow:0 2px 12px rgba(201,168,76,.3);
  flex-shrink:0;
}
.header-title{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.2px}
.header-sub{font-size:11px;color:var(--text3);margin-top:1px}
.header-right{display:flex;align-items:center;gap:20px}
.fb-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3)}
.fb-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);flex-shrink:0;transition:background .3s}
.header-date{font-size:12px;color:var(--text3);border-right:1px solid var(--border2);padding-right:20px}

/* ─── Main ─── */
main{flex:1;padding:32px 40px;max-width:1200px;margin:0 auto;width:100%;position:relative;z-index:1}
.app{display:flex;flex-direction:column;min-height:100vh}

/* ─── Upload Zone ─── */
.upload-section{margin-bottom:28px}
.dropzone{
  border:1px dashed var(--border2);
  border-radius:var(--radius-xl);
  padding:40px 32px;
  text-align:center;
  cursor:pointer;
  background:linear-gradient(135deg,var(--surface) 0%,var(--surface2) 100%);
  transition:all .25s;
  position:relative;
  overflow:hidden;
}
.dropzone::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,.06) 0%,transparent 60%);
  pointer-events:none;
}
.dropzone:hover,.dropzone.drag{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),inset 0 0 40px rgba(201,168,76,.05)}
.dropzone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.dz-icon{font-size:32px;margin-bottom:10px;filter:grayscale(.3)}
.dz-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:4px}
.dz-sub{font-size:12px;color:var(--text3)}
.file-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--gold-dim);color:var(--gold2);
  border:1px solid rgba(201,168,76,.2);
  border-radius:20px;padding:4px 10px 4px 14px;
  font-size:12px;font-weight:500;
  animation:chipIn .2s ease;
}
@keyframes chipIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.chip-rm{cursor:pointer;opacity:.5;font-size:16px;margin-right:2px;transition:opacity .15s}
.chip-rm:hover{opacity:1}

/* ─── Export Bar ─── */
.export-bar{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap;align-items:center}
.btn{
  font-family:'Heebo',sans-serif;font-size:13px;font-weight:500;
  padding:9px 18px;border-radius:var(--radius);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;
  transition:all .18s;border:1px solid var(--border2);
  background:var(--surface2);color:var(--text);
  letter-spacing:.1px;
}
.btn:hover{background:var(--surface3);border-color:var(--border2)}
.btn-gold{
  background:linear-gradient(135deg,var(--gold),#a07830);
  color:#0d0f12;border:none;font-weight:600;
  box-shadow:0 2px 12px rgba(201,168,76,.25);
}
.btn-gold:hover{box-shadow:0 4px 20px rgba(201,168,76,.4);transform:translateY(-1px)}
.btn-outline{background:transparent;border-color:var(--border2)}
.btn-outline:hover{background:var(--surface)}
.btn-danger{color:var(--red);border-color:rgba(248,113,113,.2);background:var(--red-dim)}
.btn-danger:hover{background:rgba(248,113,113,.2)}

/* ─── KPI Cards ─── */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:28px}
.kpi-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:18px 20px;
  position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.kpi-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.kpi-card::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.02) 0%,transparent 60%);pointer-events:none}
.kpi-card.total{border-color:rgba(201,168,76,.2);background:linear-gradient(135deg,var(--surface) 0%,rgba(201,168,76,.05) 100%)}
.kpi-card.total::before{content:'';position:absolute;top:0;right:0;left:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.kpi-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.kpi-val{font-size:24px;font-weight:700;line-height:1;letter-spacing:-.5px}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:6px}
.kpi-card.total .kpi-val{color:var(--gold2)}

/* ─── Tabs ─── */
.tabs-bar{display:flex;gap:2px;margin-bottom:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:4px}
.tab-btn{
  padding:9px 20px;font-size:13px;font-weight:500;
  color:var(--text2);cursor:pointer;border:none;
  background:transparent;border-radius:var(--radius);
  transition:all .18s;font-family:'Heebo',sans-serif;
  flex:1;text-align:center;
}
.tab-btn:hover{color:var(--text);background:var(--surface2)}
.tab-btn.active{color:var(--gold2);background:var(--surface2);box-shadow:inset 0 0 0 1px rgba(201,168,76,.2)}

/* ─── Tables ─── */
.table-wrap{border-radius:var(--radius-lg);border:1px solid var(--border);background:var(--surface);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:right;padding:11px 16px;
  font-size:10px;font-weight:600;color:var(--text3);
  text-transform:uppercase;letter-spacing:.7px;
  background:var(--surface2);border-bottom:1px solid var(--border);
  white-space:nowrap;
}
tbody td{text-align:right;padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--surface2)}
.total-row td{font-weight:600;background:var(--surface2);color:var(--gold2)}

/* ─── Badges ─── */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b0{background:var(--green-dim);color:var(--green)}
.b1{background:var(--amber-dim);color:var(--amber)}
.b2{background:var(--orange-dim);color:var(--orange)}
.b3{background:var(--red-dim);color:var(--red)}

/* ─── Chart Card ─── */
.chart-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:24px;margin-bottom:20px;
  position:relative;overflow:hidden;
}
.chart-card::before{content:'';position:absolute;top:0;right:0;width:200px;height:200px;background:radial-gradient(circle,rgba(201,168,76,.04) 0%,transparent 70%);pointer-events:none}
.chart-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:16px;text-transform:uppercase;letter-spacing:.5px}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:14px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}

/* ─── Company Cards ─── */
.co-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:14px;
  transition:border-color .2s;
}
.co-card:hover{border-color:var(--border2)}
.co-card-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.co-name{font-size:15px;font-weight:600;color:var(--text)}
.co-total{font-size:13px;color:var(--gold2);font-weight:600}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.bar-label{min-width:110px;font-size:11px;color:var(--text3);text-align:right}
.bar-track{flex:1;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar-amt{min-width:90px;text-align:left;font-size:12px;font-weight:600;color:var(--text)}

/* ─── Filters ─── */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.filters select,.filters input{
  font-family:'Heebo',sans-serif;font-size:12px;padding:7px 12px;
  border-radius:var(--radius);border:1px solid var(--border2);
  background:var(--surface2);color:var(--text);outline:none;
  transition:border-color .15s;
}
.filters select:focus,.filters input:focus{border-color:var(--gold)}
.filters input{min-width:200px}

/* ─── Company badge ─── */
.co-badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500;background:var(--gold-dim);color:var(--gold2)}

/* ─── Landing ─── */
.landing{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;min-height:55vh;text-align:center;
  padding:40px;
}
.landing-eyebrow{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.landing-title{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:var(--text);margin-bottom:12px;line-height:1.2}
.landing-sub{font-size:15px;color:var(--text2);max-width:400px;line-height:1.7}

/* ─── Truncate ─── */
.trunc{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trunc-sm{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ─── Divider ─── */
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.section-title{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}
.section-line{flex:1;height:1px;background:var(--border)}

@media(max-width:640px){main{padding:20px 16px}header{padding:0 20px}.kpi-row{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-left">
      <div class="header-logo-mark">AM</div>
      <div>
        <div class="header-title">דוח גביה</div>
        <div class="header-sub">קבוצת AM הנדסה</div>
      </div>
    </div>
    <div class="header-right">
      <div class="header-date" id="hdate"></div>
      <div class="fb-status">
        <span class="fb-dot" id="fb-dot"></span>
        <span id="fb-txt">מתחבר...</span>
      </div>
    </div>
  </header>

  <main>
    <!-- Upload -->
    <div class="upload-section">
      <div class="dropzone" id="dz" ondragover="ev(event,'over')" ondragleave="ev(event,'leave')" ondrop="ev(event,'drop')" onclick="document.getElementById('fi').click()">
        <input type="file" id="fi" accept=".xlsx,.xls" multiple style="display:none" onchange="hFiles(this.files)">
        <div class="dz-icon">📂</div>
        <div class="dz-title">לחץ לבחירת קבצים</div>
        <div class="dz-sub">או גרור קבצי אקסל לכאן — ניתן להעלות מספר חברות בו-זמנית</div>
      </div>
      <div class="file-chips" id="chips"></div>
    </div>

    <!-- Landing -->
    <div class="landing" id="landing">
      <div class="landing-eyebrow">Collection Report</div>
      <div class="landing-title">ניהול חובות פתוחים</div>
      <div class="landing-sub">העלה קבצי דוח חייבים מהחברות השונות לקבלת תמונה קבוצתית מלאה</div>
    </div>

    <!-- Dashboard -->
    <div id="dash" style="display:none">
      <div class="export-bar">
        <button class="btn btn-gold" onclick="exportXLSX()">⬇ ייצוא אקסל</button>
        <button class="btn btn-outline" onclick="exportHTML()">🌐 ייצוא HTML</button>
        <button class="btn btn-danger" onclick="clearData()">✕ נקה נתונים</button>
      </div>

      <div class="kpi-row" id="kpis"></div>

      <div class="tabs-bar">
        <button class="tab-btn active" onclick="swTab('summary',this)">סיכום קבוצתי</button>
        <button class="tab-btn" onclick="swTab('company',this)">לפי חברה</button>
        <button class="tab-btn" onclick="swTab('client',this)">לפי לקוח</button>
        <button class="tab-btn" onclick="swTab('detail',this)">פירוט מלא</button>
      </div>

      <div id="t-summary">
        <div class="chart-card">
          <div class="chart-title">חובות פתוחים לפי חברה</div>
          <div class="legend" id="leg"></div>
          <div style="position:relative;width:100%;height:260px">
            <canvas id="ch1" role="img" aria-label="גרף חובות לפי חברה"></canvas>
          </div>
        </div>
        <div class="section-header"><span class="section-title">פירוט לפי חברה ותקופה</span><span class="section-line"></span></div>
        <div class="table-wrap"><table id="stbl"></table></div>
      </div>

      <div id="t-company" style="display:none"><div id="co-det"></div></div>

      <div id="t-client" style="display:none">
        <div class="filters">
          <select id="fc2" onchange="rClient()"><option value="">כל החברות</option></select>
          <select id="fb2" onchange="rClient()">
            <option value="">כל התקופות</option>
            <option>פחות מ-30 יום</option><option>30-90 יום</option><option>90-180 יום</option><option>מעל 180 יום</option>
          </select>
        </div>
        <div class="table-wrap"><table id="ctbl"></table></div>
      </div>

      <div id="t-detail" style="display:none">
        <div class="filters">
          <select id="fc" onchange="rDet()"><option value="">כל החברות</option></select>
          <select id="fb" onchange="rDet()">
            <option value="">כל התקופות</option>
            <option>פחות מ-30 יום</option><option>30-90 יום</option><option>90-180 יום</option><option>מעל 180 יום</option>
          </select>
          <input id="fs" placeholder="חיפוש לקוח / פרויקט..." oninput="rDet()">
        </div>
        <div class="table-wrap"><table id="dtbl"></table></div>
      </div>
    </div>
  </main>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBd9VYbIHUlQybgK0N77ouaLymv8zQh4Xc",
  authDomain: "collection-report-baec5.firebaseapp.com",
  databaseURL: "https://collection-report-baec5-default-rtdb.firebaseio.com",
  projectId: "collection-report-baec5",
  storageBucket: "collection-report-baec5.firebasestorage.app",
  messagingSenderId: "750607589180",
  appId: "1:750607589180:web:f490803a5d199d1e310839"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const TODAY = new Date();
document.getElementById('hdate').textContent = TODAY.toLocaleDateString('he-IL', {day:'2-digit',month:'long',year:'numeric'});

let allRows=[], companies=[], chart1=null;
const BUCKETS=['פחות מ-30 יום','30-90 יום','90-180 יום','מעל 180 יום'];
const BCOLORS=['#34d399','#fbbf24','#f97316','#f87171'];
const BCLS=['b0','b1','b2','b3'];

function fmt(n){if(!n&&n!==0)return'—';return Math.round(n).toLocaleString('he-IL')+' ₪'}
function fmtK(n){
  if(!n&&n!==0)return'—';
  if(Math.abs(n)>=1000000)return(n/1000000).toFixed(1)+'M ₪';
  if(Math.abs(n)>=1000)return Math.round(n/1000)+'K ₪';
  return Math.round(n).toLocaleString('he-IL')+' ₪';
}
function parseMY(s){
  if(!s)return null;s=s.toString().trim();
  const m=s.match(/^(\d{1,2})\/(\d{2,4})$/);if(!m)return null;
  let mo=parseInt(m[1])-1,yr=parseInt(m[2]);if(yr<100)yr+=2000;
  return new Date(yr,mo,1);
}
function daysOld(s){const d=parseMY(s);if(!d)return null;return Math.floor((TODAY-d)/86400000)}
function daysOldFromDate(val){
  if(!val)return null;let d;
  if(val instanceof Date)d=val;
  else{const n=parseFloat(val);if(!isNaN(n)&&n>10000)d=new Date(Math.round((n-25569)*86400*1000));else d=new Date(val)}
  if(!d||isNaN(d.getTime()))return null;
  return Math.floor((TODAY-d)/86400000);
}
function bkt(d){
  if(d===null||d===undefined||isNaN(d))return'לא ידוע';
  if(d<30)return'פחות מ-30 יום';if(d<90)return'30-90 יום';
  if(d<180)return'90-180 יום';return'מעל 180 יום';
}
function detectCols(h){
  const f=(...opts)=>{for(const o of opts){const i=h.findIndex(x=>(x||'').toString().includes(o));if(i>=0)return i;}return -1};
  return{company:f('שם החברה','לקוח פנימי'),period:f('פעילות לחודש'),date:f('תאריך חשבון','תאריך'),client:f('שם לקוח','לקוח'),project:f('שם הפרויקט','שם פרוייקט'),amount:f('הפרש תשלום','יתרה לתשלום'),paid:f('שולם/לא שולם'),status:f('סטטוס חשבון','סטטוס'),notes:f('הערות')};
}
function processWB(wb,fname){
  let cname=fname.replace(/\.(xlsx|xls)$/i,'').replace(/___/g,'').replace(/דוח[_ ]?חייבים[_ ]?/g,'').replace(/מעודכן[_ ]?/g,'').replace(/\d{2}[._\-]\d{2}[._\-]\d{2,4}/g,'').replace(/[_\-]+/g,' ').trim()||fname;
  const sn=wb.SheetNames.find(s=>s.includes('ריכוז חובות'))||wb.SheetNames.find(s=>s.includes('REP_Bill')||s.includes('Collection')||s.includes('גביה'))||wb.SheetNames.find(s=>!s.startsWith('תרשים'));
  if(!sn)return[];
  const ws=wb.Sheets[sn];
  const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
  let hr=-1;
  const KEY_COLS=['פעילות לחודש','תאריך חשבון','יתרה לתשלום','הפרש תשלום'];
  for(let i=0;i<Math.min(8,data.length);i++){if(data[i]&&KEY_COLS.some(k=>data[i].some(c=>c&&c.toString().includes(k)))){hr=i;break}}
  if(hr<0)return[];
  const cols=detectCols(data[hr]);
  if(cols.amount<0)return[];
  const isAES=cols.period<0&&cols.date>=0;
  const rows=[];
  for(let i=hr+1;i<data.length;i++){
    const r=data[i];if(!r)continue;
    let days=null;
    if(isAES){const dateVal=r[cols.date];if(!dateVal)continue;days=daysOldFromDate(dateVal);}
    else{const period=r[cols.period];if(!period||!period.toString().match(/\d{2}\/\d{2}/))continue;const pv=cols.paid>=0?(r[cols.paid]||'').toString().replace(/\s/g,''):'';if(pv!=='ל')continue;days=daysOld(period.toString().trim());}
    let amt=r[cols.amount];
    if(amt!==null&&amt!==undefined){amt=parseFloat(amt);if(isNaN(amt))amt=null}
    if(!amt||amt<=0)continue;
    const comp=isAES?cname:((cols.company>=0&&r[cols.company])?r[cols.company].toString().split('  ')[0].trim():cname);
    const period=isAES?'':(r[cols.period]||'').toString().trim();
    const notes=cols.notes>=0?(r[cols.notes]||'').toString().substring(0,200):'';
    rows.push({company:comp||cname,period,client:(cols.client>=0?(r[cols.client]||''):'').toString(),project:(cols.project>=0?(r[cols.project]||''):'').toString(),amount:amt,notes:notes.split('\n')[0],days,bucket:bkt(days),src:fname});
  }
  return rows;
}

function setStatus(txt,ok){
  document.getElementById('fb-txt').textContent=txt;
  document.getElementById('fb-dot').style.background=ok?'var(--green)':'var(--red)';
  document.getElementById('fb-dot').style.boxShadow=ok?'0 0 6px var(--green)':'0 0 6px var(--red)';
}
function saveToFirebase(rows,fname){
  const key=fname.replace(/[.#$/\[\]]/g,'_');
  setStatus('שומר...',true);
  db.ref('data/'+key).set({rows,uploadedAt:Date.now(),fname}).then(()=>setStatus('מסונכרן ✓',true)).catch(()=>setStatus('שגיאת שמירה',false));
}
function removeFromFirebase(fname){db.ref('data/'+fname.replace(/[.#$/\[\]]/g,'_')).remove()}
function clearData(){
  if(!confirm('למחוק את כל הנתונים השמורים לכולם?'))return;
  db.ref('data').remove().then(()=>{allRows=[];document.getElementById('chips').innerHTML='';document.getElementById('dash').style.display='none';document.getElementById('landing').style.display='';setStatus('נוקה ✓',true)});
}

db.ref('data').on('value',snap=>{
  const val=snap.val();allRows=[];document.getElementById('chips').innerHTML='';
  if(val){
    Object.values(val).forEach(entry=>{if(entry&&entry.rows){allRows=allRows.concat(entry.rows);addChip(entry.fname,entry.rows.length)}});
    if(allRows.length>0){document.getElementById('landing').style.display='none';document.getElementById('dash').style.display='';renderAll();}
    else{document.getElementById('dash').style.display='none';document.getElementById('landing').style.display='';}
  }else{document.getElementById('dash').style.display='none';document.getElementById('landing').style.display='';}
  setStatus('מסונכרן ✓',true);
},()=>setStatus('שגיאת חיבור',false));

function ev(e,type){
  e.preventDefault();const dz=document.getElementById('dz');
  if(type==='over')dz.classList.add('drag');
  else if(type==='leave')dz.classList.remove('drag');
  else if(type==='drop'){dz.classList.remove('drag');hFiles(e.dataTransfer.files)}
}
function hFiles(files){
  for(const f of files){
    const rd=new FileReader();
    rd.onload=e=>{const wb=XLSX.read(e.target.result,{type:'array'});const rows=processWB(wb,f.name);if(rows.length>0)saveToFirebase(rows,f.name);else alert('לא נמצאו חובות פתוחים בקובץ: '+f.name)};
    rd.readAsArrayBuffer(f);
  }
}
function addChip(name,count){
  if(document.querySelector(`[data-f="${CSS.escape(name)}"]`))return;
  const sn=name.replace('___','').replace(/\.(xlsx|xls)$/i,'').replace(/דוח[_ ]?חייבים[_ ]?|מעודכן[_ ]?|\d{2}[._]\d{2}[._]\d{2,4}/g,'').replace(/[_\-]+/g,' ').trim();
  const chip=document.createElement('div');chip.className='chip';chip.setAttribute('data-f',name);
  chip.innerHTML=`📄 ${sn} <span style="opacity:.5;font-size:11px">(${count})</span> <span class="chip-rm" onclick="removeFromFirebase('${name.replace(/'/g,"\\'")}')">×</span>`;
  document.getElementById('chips').appendChild(chip);
}

  const html=`<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><title>דוח גביה — ${TODAY.toLocaleDateString('he-IL')}</title><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"><\/script><style>*{box-sizing:border-box;direction:rtl;margin:0;padding:0}body{font-family:'Heebo',sans-serif;background:#0d0f12;color:#e8eaf0;font-size:14px;-webkit-font-smoothing:antialiased}header{background:#12151a;border-bottom:1px solid rgba(255,255,255,.08);padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between}.lm{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,#c9a84c,#a07830);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:#0d0f12;margin-left:14px}.ht{font-size:15px;font-weight:600}.hs{font-size:11px;color:#525a6e;margin-top:1px}.c{max-width:1100px;margin:32px auto;padding:0 40px}.kr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:28px}.k{background:#181c23;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:18px 20px}.kt{background:linear-gradient(135deg,#181c23,rgba(201,168,76,.05));border-color:rgba(201,168,76,.2)}.kl{font-size:10px;font-weight:600;color:#525a6e;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}.kv{font-size:24px;font-weight:700}.ks{font-size:11px;color:#525a6e;margin-top:6px}h2{font-size:11px;font-weight:600;color:#525a6e;text-transform:uppercase;letter-spacing:.8px;margin:28px 0 14px}.card{background:#181c23;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:22px;margin-bottom:20px}table{width:100%;border-collapse:collapse}th{text-align:right;padding:10px 14px;font-size:10px;font-weight:600;color:#525a6e;text-transform:uppercase;letter-spacing:.7px;background:#1e2330;border-bottom:1px solid rgba(255,255,255,.06)}td{text-align:right;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}.lg{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}.ld{width:8px;height:8px;border-radius:2px;display:inline-block;margin-left:5px;vertical-align:middle}.nt{font-size:11px;color:#525a6e;text-align:center;margin-top:32px;padding-top:16px;border-top:1px solid rgba(255,255,255,.06)}</style></head><body><header><div style="display:flex;align-items:center"><div class="lm">AM</div><div><div class="ht">דוח גביה | קבוצת AM הנדסה</div><div class="hs">נכון לתאריך: ${TODAY.toLocaleDateString('he-IL')} | ${companies.join(' | ')}</div></div></div></header><div class="c"><div class="kr"><div class="k kt"><div class="kl">סה"כ חוב פתוח</div><div class="kv" style="color:#c9a84c">${fmtK(grand)}</div><div class="ks">${allRows.length} רשומות</div></div>${[['פחות מ-30 יום','#34d399'],['30–90 יום','#fbbf24'],['90–180 יום','#f97316'],['מעל 180 יום','#f87171']].map(([l,c],i)=>`<div class="k"><div class="kl">${l}</div><div class="kv" style="color:${c}">${fmtK(tots[BUCKETS[i]])}</div><div class="ks">${allRows.filter(r=>r.bucket===BUCKETS[i]).length} רשומות</div></div>`).join('')}</div><h2>סיכום קבוצתי לפי תקופות</h2><div class="card"><div class="lg">${BUCKETS.map((b,i)=>`<span><span class="ld" style="background:${BCOLORS[i]}"></span>${b}</span>`).join('')}</div><div style="position:relative;height:240px;margin-bottom:18px"><canvas id="ch"></canvas></div><table><thead><tr><th>חברה</th>${BUCKETS.map(b=>`<th>${b}</th>`).join('')}<th>סה"כ</th></tr></thead><tbody>${sumRows}</tbody></table></div><h2>לפי לקוח (40 גדולים)</h2><div class="card"><table><thead><tr><th>לקוח</th><th>חברה</th>${BUCKETS.map(b=>`<th>${b}</th>`).join('')}<th>סה"כ</th></tr></thead><tbody>${clRows}</tbody></table></div><h2>פירוט מלא</h2><div class="card"><table><thead><tr><th>חברה</th><th>תקופה</th><th>לקוח</th><th>פרויקט</th><th>סכום</th><th>ימים</th><th>סל</th></tr></thead><tbody>${detRows}</tbody></table></div><div class="nt">הופק ${new Date().toLocaleString('he-IL')} | קבוצת AM הנדסה</div></div><script>const d=${chartData};new Chart(document.getElementById('ch'),{type:'bar',data:{labels:d.labels,datasets:d.datasets.map(ds=>({...ds,borderRadius:4,borderSkipped:false}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#1e2330',titleColor:'#e8eaf0',bodyColor:'#8890a4',padding:10,callbacks:{label:c=>c.dataset.label+': '+Math.round(c.raw).toLocaleString('he-IL')+' ₪'}}},scales:{x:{stacked:true,grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#8890a4'}},y:{stacked:true,grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#8890a4',callback:v=>v>=1000000?(v/1000000).toFixed(1)+'M':v>=1000?Math.round(v/1000)+'K':v}}}}});<\/script></body></html>`;
